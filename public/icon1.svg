<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .orbit { transform-origin: center; animation: spin 8s linear infinite; }
    .orbit-reverse { transform-origin: center; animation: spin-rev 6s linear infinite; }
    .core { transform-origin: center; animation: pulse 2s ease-in-out infinite alternate; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes pulse { 0% { transform: scale(0.85); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }
  </style>
  <circle class="core" cx="50" cy="50" r="10" fill="#ffffff" />
  <ellipse class="orbit" cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 4" transform="rotate(30 50 50)" />
  <ellipse class="orbit-reverse" cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#a5b4fc" stroke-width="3" transform="rotate(-30 50 50)" />
  <ellipse class="orbit" cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#818cf8" stroke-width="2.5" transform="rotate(90 50 50)" />
</svg>
